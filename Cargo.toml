[workspace]
members = [
  "crates/invokrum-core",
  "crates/invokrum-schema",
  "crates/invokrum-fs",
  "crates/invokrum-digest",
  "crates/invokrum-integrity",
  "crates/invokrum-host",
  "crates/invokrum-cli",
  "crates/invokrum-distribution",
  "crates/invokrum-distribution-json",
  "crates/invokrum-acquisition",
  "crates/invokrum-acquisition-linux",
  "crates/invokrum-acquisition-archive",
  "crates/invokrum-install",
  "crates/invokrum-install-linux",
  "crates/invokrum-install-delivery",
  "crates/invokrum-verifier-ed25519",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/hackelia-micrantha/invokrum-community"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
