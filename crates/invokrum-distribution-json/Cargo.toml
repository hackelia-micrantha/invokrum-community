[package]
name = "invokrum-distribution-json"
description = "Strict canonical JSON adapter for Invokrum pack distribution manifests"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
invokrum-digest = { version = "0.2.0", path = "../invokrum-digest" }
invokrum-distribution = { version = "0.2.0", path = "../invokrum-distribution" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
