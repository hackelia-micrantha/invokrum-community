name: Bootstrap community baseline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-community-import.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-community-baseline
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: hackelia-micrantha/invokrum
  SOURCE_COMMIT: 0e6083d0608d22673b7172ce3330328c64be05bc
  TARGET_BRANCH: cutover/baseline-0e6083d

jobs:
  import:
    if: github.repository == 'hackelia-micrantha/invokrum-community'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out community repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Materialize frozen public source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "hackelia-micrantha/invokrum-community"

          source_dir="$(mktemp -d)"
          workflow_dir="$(mktemp -d)"
          trap 'rm -rf "$source_dir" "$workflow_dir"' EXIT

          git -C "$source_dir" init
          git -C "$source_dir" remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C "$source_dir" fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$SOURCE_COMMIT"

          git checkout -B "$TARGET_BRANCH" origin/main

          # GitHub workflow tokens cannot create/update workflow files. Preserve the
          # target branch's current workflow directory byte-for-byte during this push;
          # the reviewed source workflows are installed on the generated branch via
          # the target repository API before the baseline PR is opened.
          cp -a .github/workflows "$workflow_dir/workflows"

          # Preserve the community-specific repository shell. Everything copied below
          # is an explicit bootstrap allowlist from the frozen public source snapshot.
          for tree in assets completions crates docs examples schemas scripts tests; do
            rm -rf "$tree"
            cp -a "$source_dir/$tree" "$tree"
          done
          rm -rf .github
          cp -a "$source_dir/.github" .github
          rm -rf .github/workflows
          cp -a "$workflow_dir/workflows" .github/workflows

          for file in \
            .gitignore \
            CHANGELOG.md \
            CODE_OF_CONDUCT.md \
            Cargo.lock \
            Cargo.toml \
            GOVERNANCE.md \
            LICENSE \
            RELEASE_NOTES_v0.1.0.md \
            SUPPORT.md \
            deny.toml \
            rust-toolchain.toml; do
            cp -a "$source_dir/$file" "$file"
          done

          # Canonical-only promotion policy never belongs in the community snapshot.
          rm -f community-export-policy.toml

          # Repository-relocation transformations are deliberately limited to exact
          # public source/release endpoints that must resolve to this repository.
          python3 - <<'PY'
          from pathlib import Path

          transforms = {
              "Cargo.toml": [
                  (
                      'repository = "https://github.com/hackelia-micrantha/invokrum"',
                      'repository = "https://github.com/hackelia-micrantha/invokrum-community"',
                  ),
              ],
              "scripts/release.py": [
                  (
                      "https://github.com/hackelia-micrantha/invokrum/sbom/",
                      "https://github.com/hackelia-micrantha/invokrum-community/sbom/",
                  ),
              ],
              "docs/release.md": [
                  (
                      "--repo hackelia-micrantha/invokrum",
                      "--repo hackelia-micrantha/invokrum-community",
                  ),
              ],
              "docs/releases/v0.1.0.md": [
                  (
                      "--repo hackelia-micrantha/invokrum",
                      "--repo hackelia-micrantha/invokrum-community",
                  ),
              ],
          }
          for relative, replacements in transforms.items():
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"expected relocation token in {relative}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old_status = (
              "Repository split preparation is in progress. Until the baseline import lands, "
              "this repository contains only the public repository scaffolding and license.\n\n"
              "After cutover, this repository is expected to contain the supported public "
              "Invokrum source, schemas, examples, compatibility fixtures, documentation, CI, "
              "and releases that can be built and evaluated without access to the private "
              "canonical repository."
          )
          new_status = (
              "The initial public implementation baseline is imported from canonical source "
              "snapshot `0e6083d0608d22673b7172ce3330328c64be05bc`. This repository now "
              "contains the supported public Invokrum source, schemas, examples, compatibility "
              "fixtures, documentation, CI, and release tooling needed to build and evaluate "
              "the community distribution independently."
          )
          if old_status not in text:
              raise SystemExit("community README status block changed unexpectedly")
          text = text.replace(old_status, new_status)
          design_heading = "## Design expectations\n\n"
          threat_note = (
              "The public security claims and residual risks are defined by the "
              "[threat model](docs/security/threat-model.md) and must remain backed by "
              "controls and tests available in this repository.\n\n"
          )
          if design_heading not in text:
              raise SystemExit("community README design heading changed unexpectedly")
          text = text.replace(design_heading, design_heading + threat_note, 1)
          readme.write_text(text, encoding="utf-8")

          security = Path("SECURITY.md")
          text = security.read_text(encoding="utf-8")
          old_boundary = (
              "After the initial implementation baseline is imported, the public threat model "
              "and supported-version policy in this repository define the security claims "
              "available to community users. Security claims must map to controls and tests "
              "present in the community checkout; private-only controls must not be represented "
              "as community guarantees."
          )
          new_boundary = (
              "The [public threat model](docs/security/threat-model.md) and supported-version "
              "policy in this repository define the security claims available to community "
              "users. Security claims must map to controls and tests present in the community "
              "checkout; private-only controls must not be represented as community guarantees."
          )
          if old_boundary not in text:
              raise SystemExit("community SECURITY boundary block changed unexpectedly")
          text = text.replace(old_boundary, new_boundary)
          old_versions = (
              "Until the baseline import is complete, this repository contains split scaffolding "
              "only and has no independently released implementation version. After cutover, the "
              "default branch and explicitly supported public releases receive best-effort security "
              "fixes unless an advisory states otherwise."
          )
          new_versions = (
              "The default branch and explicitly supported public releases receive best-effort "
              "security fixes unless an advisory states otherwise."
          )
          if old_versions not in text:
              raise SystemExit("community SECURITY supported-version block changed unexpectedly")
          security.write_text(text.replace(old_versions, new_versions), encoding="utf-8")
          PY

          cutover_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > UPSTREAM.md <<EOF
          # Upstream provenance

          This repository is the public community distribution of Invokrum. Shared implementation originates in the separately maintained canonical repository and is promoted here through reviewed, allowlisted snapshots rather than private-history mirroring.

          ## Initial public baseline

          - Source repository: \`${SOURCE_REPOSITORY}\`
          - Source commit: \`${SOURCE_COMMIT}\`
          - Cutover timestamp (UTC): \`${cutover_timestamp}\`
          - License at source commit: Apache-2.0

          The source commit was publicly accessible before the canonical repository visibility change.

          ## Accounted baseline differences

          The initial community tree intentionally differs from the selected source snapshot only in repository-boundary material:

          - community-specific \`README.md\`, \`CONTRIBUTING.md\`, and \`SECURITY.md\` are retained; README/SECURITY cutover status is finalized and both link the imported public threat model required by the public security contract;
          - this \`UPSTREAM.md\` records source provenance and the cutover timestamp;
          - \`Cargo.toml\`, \`scripts/release.py\`, \`docs/release.md\`, and \`docs/releases/v0.1.0.md\` point public source/release metadata at \`hackelia-micrantha/invokrum-community\`;
          - canonical-only \`community-export-policy.toml\` is omitted;
          - the public topology document remains unchanged because references to the canonical repository there describe provenance and promotion direction rather than a public download/source endpoint.

          All imported implementation, schema, example, fixture, ordinary documentation, and final workflow bytes are otherwise sourced from the commit above. Future promotions must record their canonical source commit or range without copying private Git history.
          EOF

          test ! -e community-export-policy.toml
          test -f crates/invokrum-install-delivery/Cargo.toml
          grep -Fq 'repository = "https://github.com/hackelia-micrantha/invokrum-community"' Cargo.toml
          grep -Fq 'https://github.com/hackelia-micrantha/invokrum-community/sbom/' scripts/release.py
          grep -Fq -- '--repo hackelia-micrantha/invokrum-community' docs/release.md
          grep -Fq -- '--repo hackelia-micrantha/invokrum-community' docs/releases/v0.1.0.md
          grep -Fq 'docs/security/threat-model.md' README.md
          grep -Fq 'docs/security/threat-model.md' SECURITY.md
          grep -Fq "$SOURCE_COMMIT" UPSTREAM.md

          cargo fmt --all --check
          cargo test --workspace --all-features --locked
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/check_architecture.py
          python3 scripts/check_workflow_pins.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "bootstrap produced no changes" >&2
            exit 1
          }
          git commit -m "chore: import public baseline from invokrum ${SOURCE_COMMIT:0:7}"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
