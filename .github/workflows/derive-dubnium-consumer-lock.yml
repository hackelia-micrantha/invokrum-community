name: Derive Dubnium consumer lock

on:
  push:
    branches:
      - ops/derive-dubnium-consumer-lock
    paths:
      - consumer-lock/flake.nix
      - .github/workflows/derive-dubnium-consumer-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Generate consumer lock
        run: nix flake lock --show-trace ./consumer-lock
      - name: Commit generated lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add consumer-lock/flake.lock
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record generated Dubnium consumer lock'
          git push origin HEAD:${GITHUB_REF_NAME}
