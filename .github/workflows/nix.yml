name: Nix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    name: Public flake
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Validate locked flake
        run: nix flake check --show-trace
      - name: Build public CLI package
        run: nix build --no-link --show-trace .#packages.x86_64-linux.invokrum
      - name: Exercise exported app
        run: nix run .#invokrum -- --version
